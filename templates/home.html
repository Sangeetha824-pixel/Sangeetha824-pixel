              <div class="col-12 col-sm-6 py-2 ">
                <input type="text" class="form-control" placeholder="Time" name="time1" required>
              </div>

              </div>

              </div>
              <div class="col-12 col-sm-6 py-2 ">
                <input type="text" class="form-control" placeholder="Transaction V11" name="V11" required>
              </div>
              <div class="col-12 col-sm-6 py-2 ">
                <input type="text" class="form-control" placeholder="Transaction V12" name="V12" required>
              </div>
            
              <div class="col-12 col-sm-6 py-2 ">
                <input type="text" class="form-control" placeholder="Amount" name="amt" required>
              </div>

      
            </div>
    
            <button type="submit" class="btn btn-primary mt-3 wow zoomIn">Submit Request</button>
